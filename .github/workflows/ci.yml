name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      # Transitive highs in onnxruntime-node/sharp currently have no upstream fix;
      # fail the job on criticals so new critical CVEs still gate merges.
      - run: bun audit --audit-level=critical
      - run: bun run --if-present typecheck
      - run: bun run --if-present lint
      - run: bun run --if-present test
      - run: bun run --if-present build
      # dist/ is committed and the plugin runs dist/, so dist/ must match a build of this commit.
      # A dependency bump merged without a rebuild ships a bundle that the lockfile does not
      # describe. Line endings are ignored: tsc writes native ones on each platform.
      - name: Committed dist/ matches the build
        run: git diff --ignore-cr-at-eol --stat --exit-code -- dist

      # The two doc gates read the source, so they run after the final build.
      # repo-tools is pinned to the version the gates were verified with.
      - name: Install repo-tools
        run: npm install -g @danielsimonjr/repo-tools@2.3.0
      - name: Architecture docs gate (no drift from the recorded counts)
        run: repo-tools check . --docs=docs/architecture
      - name: Code docs gate (every exported symbol documented)
        run: repo-tools docs check .

      # Production runtime is NODE; Bun is the package manager + script driver.
      # Every install/test/build step above runs under Bun, so without this the
      # shipped artifact is never executed by the runtime that actually runs it.
      # The six repos reverted during the Bun migration all failed there:
      # on deps Bun's non-hoisted node_modules resolved and Node did not.
      #
      # Fails on a throw, a syntax error, or an unresolvable import. A server that
      # self-starts on import PASSES after 5s -- it started and did not crash. Verified
      # failure-capable before adoption (corrupt artifact -> exit 1; missing dep -> exit 1).
      - name: Node runtime smoke (the shipped artifact must load under Node)
        run: |
          node --input-type=module -e '
            const entry = "./dist/index.js";
            const t = setTimeout(() => {
              console.log("PASS: self-started under Node, no crash within 5s");
              process.exit(0);
            }, 5000);
            import(entry).then(() => {
              clearTimeout(t);
              console.log("PASS: loaded cleanly under Node");
              process.exit(0);
            }).catch((e) => {
              clearTimeout(t);
              console.error("FAIL: " + entry + " did not load under Node -> " + e.message);
              process.exit(1);
            });
          '

  # The Node floor (src/node-floor.ts) is 22.16.0: the first Node whose node:sqlite has
  # DatabaseSync.isTransaction. This job runs the suite on that exact version. It is a separate
  # job so the required "build" check keeps its name.
  node-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: node -p process.version
      - run: bun run --if-present test
      # Node 22 prints an ExperimentalWarning when node:sqlite loads. The adapter drops that one
      # warning, so the shipped dist must load the module with an empty stderr.
      - name: node:sqlite loads without a warning
        run: |
          node --input-type=module -e '
            const { Database } = await import("./dist/sqlite.js");
            const db = new Database(":memory:");
            db.close();
          ' 2> stderr.txt
          if [ -s stderr.txt ]; then cat stderr.txt; exit 1; fi
